<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>固定并穿透</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      button {
        position: relative;
        width: 30px;
        height: 30px;
        margin: 2px;
        padding: 0;
        color: #38515a;
        background: rgb(255 255 255 / 70%);
        border: 1px solid rgb(73 103 112 / 32%);
        border-radius: 50%;
        box-shadow: 0 3px 10px rgb(22 42 49 / 18%);
        cursor: pointer;
        opacity: 0.58;
        transition: opacity 120ms ease, background 120ms ease, transform 120ms ease;
      }
      button:hover { opacity: 1; transform: scale(1.05); }
      button.locked { color: #9b4e56; background: rgb(255 240 242 / 92%); opacity: 0.9; }
      .shackle {
        position: absolute;
        left: 9px;
        top: 6px;
        width: 10px;
        height: 10px;
        border: 2px solid currentColor;
        border-bottom: 0;
        border-radius: 7px 7px 0 0;
      }
      button:not(.locked) .shackle { left: 12px; transform: rotate(24deg); transform-origin: left bottom; }
      .body {
        position: absolute;
        left: 7px;
        top: 14px;
        width: 14px;
        height: 10px;
        background: currentColor;
        border-radius: 3px;
      }
      .body::after {
        position: absolute;
        left: 6px;
        top: 3px;
        width: 2px;
        height: 4px;
        background: white;
        border-radius: 1px;
        content: "";
      }
    </style>
  </head>
  <body>
    <button id="lock" type="button" title="开启固定并穿透" aria-label="开启固定并穿透">
      <span class="shackle"></span><span class="body"></span>
    </button>
    <script>
      const button = document.getElementById('lock')
      const applyState = (state) => {
        const locked = Boolean(state.locked)
        button.classList.toggle('locked', locked)
        button.title = locked ? '关闭固定并穿透' : '开启固定并穿透'
        button.setAttribute('aria-label', button.title)
      }
      button.addEventListener('click', () => window.mioLockControl.toggle())
      window.mioLockControl.onState(applyState)
    </script>
  </body>
</html>
