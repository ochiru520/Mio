name: 后端检查

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖
        run: python -m pip install -r backend/requirements.txt
      - name: 扫描高置信度密钥
        shell: pwsh
        run: |
          $hits = @(git grep -I -n -E 'sk-[A-Za-z0-9_-]{24,}' -- .)
          if ($LASTEXITCODE -eq 0 -and $hits.Count) {
            $hits | Write-Host
            throw '发现疑似 API Key'
          }
          if ($LASTEXITCODE -notin @(0, 1)) { throw '密钥扫描执行失败' }
      - name: 编译检查
        working-directory: backend
        run: python -m compileall app
      - name: 运行测试
        working-directory: backend
        run: python -m unittest discover -s tests
